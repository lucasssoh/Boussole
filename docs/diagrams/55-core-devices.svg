djust="spacing" text-decoration="underline" textLength="133.4335" x="1440.16" y="473.7059">+newKey() : 256 bits</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="138.5855" x="1440.16" y="492.2698">+newCode() : 6 digits</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="141.6795" x="1440.16" y="510.8337">+hash(key) : SHA-256</text></g><!--class PairingRefusedException--><g class="entity" data-qualified-name="device.PairingRefusedException" data-source-line="84" id="ent0023"><rect fill="#F1F1F1" height="28.5639" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.6294" x="1226.19" y="450.4139"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.6294" x="1229.19" y="470.0299">PairingRefusedException</text></g><g class="entity" data-qualified-name="GMN45" data-source-line="110" id="ent0046"><path d="M2147.23,416.6039 L2147.23,512.794 L2428.7633,512.794 L2428.7633,426.6039 L2418.7633,416.6039 L2147.23,416.6039" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2418.7633,416.6039 L2418.7633,426.6039 L2428.7633,426.6039 L2418.7633,416.6039" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.1532" x="2153.23" y="435.1759">Offers and requests live in memory only:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.5333" x="2153.23" y="452.4139">a restart forgets them. A code serves once;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.1962" x="2153.23" y="469.652">an offer goes after five wrong codes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.7442" x="2153.23" y="486.89">A request accepted but never collected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.6032" x="2153.23" y="504.128">takes its device away when it expires.</text></g><g class="entity" data-qualified-name="GMN48" data-source-line="118" id="ent0049"><path d="M2147.12,611.5739 L2147.12,673.288 A0,0 0 0 0 2147.12,673.288 L2392.8772,673.288 A0,0 0 0 0 2392.8772,673.288 L2392.8772,621.5739 L2382.8772,611.5739 L2190.72,611.5739 L1928.92,517.5939 L2182.72,611.5739 L2147.12,611.5739 A0,0 0 0 0 2147.12,611.5739" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2382.8772,611.5739 L2382.8772,621.5739 L2392.8772,621.5739 L2382.8772,611.5739" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0472" x="2153.12" y="630.1459">Only the hash of each key is kept:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7572" x="2153.12" y="647.3839">the key is handed once to the device,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.4032" x="2153.12" y="664.622">in a cookie its page cannot read.</text></g><!--link OfferPairing to PairingDesk--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="87" id="lnk24"><path codeLine="87" d="M263.85,150.7739 C270.31,152.1339 276.73,153.4239 283,154.6039 C537.45,202.4739 835.8492,235.1323 983.2892,249.7423" fill="none" id="OfferPairing-to-PairingDesk" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="989.26,250.3339,980.6983,245.4659,984.2844,249.8409,979.9094,253.427,989.26,250.3339" style="stroke:#181818;stroke-width:1;"/></g><!--link PreviewPairing to PairingDesk--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-lin