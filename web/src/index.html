<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boussole</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b7a5f">
</head>
<body>
  <app-root>
    <div style="position: fixed; inset: 0; display: grid; place-items: center; background: #eef3f6; font-family: system-ui, sans-serif">
      <div style="display: grid; justify-items: center; gap: 14px; color: #0b7a5f; font-weight: 900; font-size: 20px; animation: boot 0.3s ease-out 0.2s backwards">
        <img src="favicon.svg" alt="" width="56" height="56">
        Boussole
      </div>
    </div>
    <style>@keyframes boot { from { opacity: 0; transform: scale(0.9); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  </app-root>
</body>
</html>
