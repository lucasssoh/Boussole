# A tag v* builds Boussole, packages it for Linux, macOS and Windows with its own Java inside,
# and publishes the GitHub release with its section of the changelog.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        if: matrix.os == 'ubuntu-latest'
        run: mvn -B verify
      - name: Build
        if: matrix.os != 'ubuntu-latest'
        run: mvn -B -DskipTests package
      - name: Package
        shell: bash
        run: bin/package
      - uses: actions/upload-artifact@v4
        with:
          name: boussole-${{ matrix.os }}
          path: |
            target/package/*.tar.gz
            target/package/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          title="$(grep -m1 "^## $version" CHANGELOG.md | sed 's/^## /v/')"
          gh release create "$GITHUB_REF_NAME" packages/* --title "$title" --notes-file notes.md
