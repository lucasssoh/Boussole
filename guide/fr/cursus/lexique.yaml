- id: agent
  term: Agent IA
  aliases: [agent]
  definition: >
    Un assistant qui travaille dans tes fichiers, comme Claude Code, Codex ou Gemini CLI. C'est
    lui qui lit tes documents et écrit le cours.

- id: skill
  term: Skill
  aliases: [skills]
  definition: >
    Une fiche d'instructions pour l'agent, installée par `boussole init` dans `.boussole/skills/` :
    comment poser tes préférences, planifier, écrire une séance, des exercices…

- id: cursus
  term: Cursus
  definition: >
    Le dossier `cursus/` d'un cours : le plan (`syllabus.yaml`), les séances, le lexique. Tout
    ce que Boussole t'affiche vient de là.

- id: plan
  term: Plan du cours
  aliases: [plan, syllabus]
  definition: >
    La liste des chapitres et des séances, avec leur durée et leur objectif. L'agent le propose,
    **toi seul l'approuves**.

- id: validateur
  term: Validateur
  aliases: [boussole validate]
  definition: >
    La commande `boussole validate` : elle vérifie que le cours suit le format de Boussole et dit
    précisément quoi corriger. L'agent la lance après chaque changement.

- id: registre
  term: Registre des documents
  aliases: [sources.yaml]
  definition: >
    Le fichier `cursus/sources.yaml` : ce que le cours a fait de chacun de tes documents (utilisé,
    ignoré, en attente), avec son empreinte, pour repérer ceux qui arrivent ou changent.
