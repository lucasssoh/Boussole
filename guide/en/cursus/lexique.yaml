- id: agent
  term: AI agent
  aliases: [agent]
  definition: >
    An assistant that works in your files, such as Claude Code, Codex or Gemini CLI. It reads
    your documents and writes the track.

- id: skill
  term: Playbook
  aliases: [playbooks, skill, skills]
  definition: >
    A sheet of instructions for your agent, installed by `boussole init`: how to learn your
    learning style, make a plan, write a session, write exercises…

- id: cursus
  term: Cursus folder
  aliases: [cursus]
  definition: >
    The `cursus/` folder of a track: the plan (`syllabus.yaml`), the sessions, the lexicon.
    Everything Boussole presents to you comes from there.

- id: plan
  term: Plan
  aliases: [plan for approval, syllabus]
  definition: >
    The list of chapters and sessions, with their length and goal. The agent proposes it,
    **only you approve it**.

- id: validator
  term: Quality check
  aliases: [validator, boussole validate]
  definition: >
    The `boussole validate` command: it checks that the track is well written and says exactly
    what to fix. The agent runs it after every change.

- id: record
  term: Document tracking
  aliases: [record, sources.yaml]
  definition: >
    The `cursus/sources.yaml` file: what the track did with each of your documents (used,
    ignored, pending), with its fingerprint, to spot those that arrive or change.
